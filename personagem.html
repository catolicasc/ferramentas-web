<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Personagem</title>
  <link rel="stylesheet" href="style.css">
</head>

<style>
  body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #1e1e2f;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background-color: #2c2c3e;
  color: white;
  width: 320px;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.4);
  text-align: center;
}

.card img {
  width: 100%;
  border-radius: 8px;
}

h1 {
  margin: 15px 0 10px;
}

.descricao {
  font-size: 14px;
  margin-bottom: 15px;
}

.habilidades, .caracteristicas {
  text-align: left;
  margin-top: 15px;
}

h2 {
  font-size: 16px;
  margin-bottom: 5px;
}

ul {
  padding-left: 20px;
}

li {
  margin-bottom: 5px;
}
</style>
<body>

  <main class="container">
    <section class="card">

      <img src="./assets/nosso-personagem.png" alt="Imagem do personagem">

      <h1>Arkon, o Guerreiro</h1>

      <p class="descricao">
        Um guerreiro lendário das montanhas do norte, conhecido por sua força e honra.
      </p>

      <div class="habilidades">
        <h2>Habilidades</h2>
        <ul>
          <li>Força extrema</li>
          <li>Resistência</li>
          <li>Espada lendária</li>
        </ul>
      </div>

      <div class="caracteristicas">
        <h2>Características</h2>
        <p><strong>Classe:</strong> Guerreiro</p>
        <p><strong>Nível:</strong> 45</p>
        <p><strong>Elemento:</strong> Terra</p>
      </div>

    </section>
  </main>

</body>
</html>
